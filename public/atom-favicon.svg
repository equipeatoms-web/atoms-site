<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="core" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5d98a"/>
      <stop offset="60%" stop-color="#c8a84b"/>
      <stop offset="100%" stop-color="#8a6a1a"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f5d98a"/>
      <stop offset="100%" stop-color="#a07820"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0a" rx="16"/>

  <!-- Orbit 1 — horizontal ellipse -->
  <ellipse cx="50" cy="50" rx="38" ry="13" fill="none" stroke="url(#core)" stroke-width="2.2" filter="url(#glow)" transform="rotate(0,50,50)"/>
  <!-- Orbit 2 — tilted 60° -->
  <ellipse cx="50" cy="50" rx="38" ry="13" fill="none" stroke="url(#core)" stroke-width="2.2" filter="url(#glow)" transform="rotate(60,50,50)"/>
  <!-- Orbit 3 — tilted 120° -->
  <ellipse cx="50" cy="50" rx="38" ry="13" fill="none" stroke="url(#core)" stroke-width="2.2" filter="url(#glow)" transform="rotate(120,50,50)"/>

  <!-- Electron balls on orbit tips -->
  <circle cx="88" cy="50" r="4.5" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="12" cy="50" r="4.5" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="69" cy="17" r="4.5" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="31" cy="83" r="4.5" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="31" cy="17" r="4.5" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="69" cy="83" r="4.5" fill="url(#ball)" filter="url(#glow)"/>

  <!-- Nucleus -->
  <circle cx="50" cy="50" r="9" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="9" fill="none" stroke="#f5d98a" stroke-width="0.8" opacity="0.5"/>
</svg>
