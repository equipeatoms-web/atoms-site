<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/atom-favicon.svg" />
    <link rel="apple-touch-icon" href="/atom-favicon.svg" />
    <title>ATom's — Sistemas que Pensam</title>
    <meta name="description" content="ATom's: sistemas de IA aplicada que pensam e agem pela sua empresa — do WhatsApp ao banco de dados." />
    <meta name="author" content="André · ATom's" />
    <meta name="keywords" content="ATom's, engenheiro de IA, IA aplicada, agentes WhatsApp, automação empresarial, n8n, Supabase, sistemas de IA sob medida" />

    <meta property="og:title" content="ATom's — Sistemas que Pensam" />
    <meta property="og:description" content="Construímos o sistema de IA da sua empresa. Diagnóstico, arquitetura e implementação." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Barlow:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Barlow:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <style>
      html, body { background: #0a0a0a; color: #f0ede8; }
      #root { min-height: 100vh; }
      .__loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .__loading::after {
        content: "";
        width: 32px; height: 32px;
        border: 1px solid #1e1e1e;
        border-top-color: #c8b89a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="root"><div class="__loading" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
